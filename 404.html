<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Stackly Financial Consulting</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #F8FAFC;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-page-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .error-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 28px;
            padding: 55px 45px;
            text-align: center;
            max-width: 660px;
            width: 100%;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.04);
            box-sizing: border-box;
        }

        .error-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 18px;
            background: #FEE2E2;
            color: #DC2626;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .error-badge i {
            font-size: 13px;
        }

        .error-code {
            font-size: 100px;
            font-weight: 800;
            line-height: 1;
            color: #7E1B1B;
            margin: 0 0 20px 0;
            letter-spacing: -2px;
        }

        .error-title {
            font-size: 28px;
            font-weight: 800;
            color: #081427;
            margin: 0 0 16px 0;
        }

        .error-description {
            color: #64748B;
            font-size: 15px;
            line-height: 1.65;
            max-width: 520px;
            margin: 0 auto 35px auto;
        }

        .error-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn-home {
            background: #7E1B1B;
            color: #FFFFFF;
            padding: 14px 26px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(126, 27, 27, 0.2);
            border: none;
        }

        .btn-home:hover {
            background: #631414;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(126, 27, 27, 0.3);
            color: #FFFFFF;
        }

        .btn-consult {
            background: transparent;
            color: #7E1B1B;
            padding: 14px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-consult:hover {
            color: #631414;
            background: rgba(126, 27, 27, 0.05);
        }

        @media (max-width: 640px) {
            .error-card {
                padding: 40px 24px;
                border-radius: 20px;
            }

            .error-code {
                font-size: 75px;
            }

            .error-title {
                font-size: 22px;
            }

            .error-description {
                font-size: 14px;
            }

            .error-actions {
                flex-direction: column;
                gap: 12px;
            }

            .btn-home, .btn-consult {
                width: 100%;
                justify-content: center;
                box-sizing: border-box;
            }
        }
    </style>
</head>

<body>
    <div class="loader-wrapper" id="loader">
        <div class="loader-text">Stackly.</div>
    </div>

    <div class="error-page-wrapper">
        <div class="error-card" data-aos="fade-up">
            <div style="margin-bottom: 25px; text-align: center;">
                <a href="index.html">
                    <img src="assets/images/stackly logo RED.webp" alt="Stackly Financial Consulting Logo" class="site-logo">
                </a>
            </div>
            <div class="error-badge">
                <i class="fas fa-compass"></i> 404 Error
            </div>
            <h1 class="error-code">404</h1>
            <h2 class="error-title">Portfolio Route Not Found</h2>
            <p class="error-description">
                The web location you attempted to reach does not exist or may have been relocated during our platform updates. Let us assist you in navigating back to safety.
            </p>
            <div class="error-actions">
                <a href="index.html" class="btn-home">
                    <i class="fas fa-home"></i> Back to Home
                </a>
                <a href="javascript:history.back()" onclick="if(document.referrer){history.back();}else{window.location.href='index.html';} return false;" class="btn-consult">
                    <i class="fas fa-arrow-left"></i> Go Back
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
